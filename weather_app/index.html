<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css" />
    <title>Weather App</title>
  </head>
  <body>
    <main>
      <div class="container flex-group">
        <!-- Results Container  -->
        <div class="results-container">
          <div>
            <!-- Night or Day Image -->
            <!-- <picture class="weather-img"> -->
            <img class="time" src="https://placehold.co/400x300" alt="" />
            <div class="icon">
              <img src="" alt="" />
            </div>
            <!-- </picture> -->
          </div>
          <!-- Weather Details -->
          <div class="card-details">
            <h3>City Name</h3>
            <div class="sub-title">Weather Condition</div>
            <div>
              <span>temp</span>
              <span>&deg;C</span>
            </div>
          </div>
        </div>
        <!-- Input weather Container  -->
        <div class="input-container">
          <div class="titles">
            <p class="sub-title">Weather or Not</p>
            <h1 class="title">Weather App</h1>
          </div>
          <!-- Form -->
          <form class="change-location">
            <!-- <label for="city">Explore the weather in</label> -->
            <br />
            <input
              id="city"
              type="text"
              name="city"
              class="form-input"
              placeholder="Giggleswick"
            />
          </form>
        </div>
      </div>
    </main>

    <!-- Javascript Files -->
    <script src="scripts/forecast.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
